name: PR title

# Pull requests are squash-merged and the PR title becomes the commit message
# on main, so it must follow Conventional Commits.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Lowercase, or a version number for release titles ("chore(release): 1.2.3").
          subjectPattern: ^([a-z].*[^.]|\d+\.\d+\.\d+(-[0-9A-Za-z.-]*[0-9A-Za-z])?)$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter (or be a version
            number, for releases) and not end with a period,
            e.g. "fix: keep favourites above the Modded group".
