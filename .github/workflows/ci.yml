name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install StyLua and selene
        run: python tools/install_tools.py
      - name: Check formatting (StyLua)
        run: stylua --check src
      - name: Lint (selene)
        run: selene src
      - name: Install Ruff
        run: pip install -r tools/requirements-dev.txt
      - name: Lint Python tools (Ruff)
        run: ruff check tools
      - name: Check Python formatting (Ruff)
        run: ruff format --check tools

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the mod zip
        run: python tools/build.py
      - name: Upload the mod zip
        uses: actions/upload-artifact@v7
        with:
          name: paddock-${{ github.sha }}
          path: dist/paddock.zip
          if-no-files-found: error
